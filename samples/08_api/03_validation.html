<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>分配验证</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">

	<script src="../common/testdata.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}

		.busy {
			background: #FFC8C7 !important;
		}
	</style>
</head>

<body>
<div id="gantt_here" style='width:100%; height:100%;'></div>
<script>

	gantt.config.columns = [
		{name: "text", label: "任务名称", resize: true, tree: true, width: '*'},
		{name: "start_date", align: "center"},
		{
			name: "assigned", label: "Assigned to", resize: true, align: "center", width: 100,
			template: function (item) {
				if (!item.users) return "Nobody";
				return item.users.join(", ");
			}
		}
	];

	gantt.init("gantt_here");
	gantt.parse(users_data);

	function validate资源(id) {
		var task = gantt.get任务(id);
		var from = new Date(task.start_date),
			to = new Date(task.end_date),
			busy_from = null,
			busy_to = null,
			busy_task = null,
			busy = false;


		var tasks = gantt.get任务ByTime(from, to);
		for (var i = 0; i < tasks.length; i++) {
			if (tasks[i].id != id && task.users.join() == tasks[i].users.join()) {
				if (!busy_from || busy_from.valueOf() < tasks[i].start_date.valueOf())
					busy_from = new Date(tasks[i].start_date);

				if (!busy_to || busy_to.valueOf() < tasks[i].end_date.valueOf())
					busy_to = new Date(tasks[i].end_date);
				busy_task = tasks[i].id;
				busy = true;


			}
		}
		if (busy) {
			gantt.templates.timeline_cell_class = function (task, date) {
				if ((date.valueOf() < busy_to.valueOf() && date.valueOf() >= busy_from.valueOf())) {
					return "busy";
				}
			};
			gantt.message(task.users + " are already busy on <b>" + gantt.get任务(busy_task).text + "</b> at this time!");
		} else {
			gantt.templates.timeline_cell_class = function () {
			};

		}

		gantt.refreshData();
		return !busy;
	}

	gantt.attachEvent("onBefore任务Changed", function (id, mode, task) {
		if (mode == gantt.config.drag_mode.move || mode == gantt.config.drag_mode.resize) {
			return validate资源(id);
		}
		return true;
	});
	gantt.attachEvent("on任务编辑框保存", function (id, task, is_new) {
		return validate资源(id);
	});

	gantt.message("任务s cannot be assigned to the same dates of the same resources");

</script>
</body>
