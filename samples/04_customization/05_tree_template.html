<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>树节点模板</title>

	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">

	<script src="../common/testdata.js"></script>
	<style>
		.important {
			color: red;
		}
		html, body{
			padding:0;
			margin: 0;
		}
	</style>
</head>

<body>
<div id="gantt_here" style='height:100vh;'></div>


<script>
	gantt.config.columns = [
		{name: "text", label: "任务名称", tree: true, resize: true, width: 230, template: function (task) {
			if (task.priority == 1)
				return "<div class='important'>" + task.text + " (" + task.users + ") </div>";
			return task.text + " (" + task.users + ")";
		}},
		{name: "start_date", label: "开始 time", resize: true, align: "center"},
		{name: "duration", label: "工期", align: "center"}
	];
	gantt.init("gantt_here");
	gantt.parse(users_data);

</script>
</body>
