<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>任务样式</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">

	<script src="../common/testdata.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}

		.high {
			--dhx-gantt-task-background: #d96c49;
		}


		.medium {
			--dhx-gantt-task-background:  #34c461;
		}


		.low {
			--dhx-gantt-task-background: #6ba8e3;
		}

	</style>
</head>

<body>
<div id="gantt_here" style='width:100%; height:100%;'></div>
<script>
	gantt.init("gantt_here");
	gantt.config.columns = [
		{name: "text", label: "任务名称", tree: true, width: "*", resize: true},
		{name: "start_date", label: "开始 time", align: "center", resize: true},
		{
			name: "priority", label: "优先级", align: "center", template: function (obj) {
				if (obj.priority == 1) {
					return "高"
				}
				if (obj.priority == 2) {
					return "Medium"
				}
				return "低"
			}
		}
	];
	gantt.templates.task_class = function (start, end, task) {
		switch (task.priority) {
			case "1":
				return "high";
				break;
			case "2":
				return "medium";
				break;
			case "3":
				return "low";
				break;
		}
	};

	gantt.parse(users_data);
</script>
</body>
