<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>行内编辑</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<script src="../common/testdata.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}


	</style>
</head>

<body>
<div id="gantt_here" style='width:100%; height:100%;'></div>
<script>
	gantt.serverList("priority", [
		{key: "1", label: "低"},
		{key: "2", label: "普通"},
		{key: "3", label: "高"}
	]);

	var text编辑or = {type: "text", map_to: "text"};
	var date编辑or = {type: "date", map_to: "start_date", min: new Date(2023, 0, 1), max: new Date(2024, 0, 1)};
	var duration编辑or = {type: "number", map_to: "duration", min:0, max: 100};
	var priority = {type: "select", map_to: "priority", options:gantt.serverList("priority")};

	function priorityLabel(task){
		var value = task.priority;
		var list = gantt.serverList("priority");
		for(var i = 0; i < list.length; i++){
			if(list[i].key == value){
				return list[i].label;
			}
		}
		return "";
	}

	gantt.config.columns = [
		{name: "text", tree: true, width: 200, resize: true, editor: text编辑or},
		{name: "start_date", align: "center", width: 100, resize: true, editor: date编辑or},
		{name: "duration", align: "center", width: 90, resize: true, editor: duration编辑or},
		{name: "priority", label: "优先级", width:80, align: "center", resize: true, editor: priority, template: priorityLabel},
		{name: "add", width: 44}
	];

	gantt.init("gantt_here");
	gantt.parse(demo_tasks);

</script>
</body>
