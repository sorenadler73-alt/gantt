<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>表格中的自定义按钮</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">

	<script src="../common/testdata.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}

		.fa {
			cursor: pointer;
			font-size: 14px;
			text-align: center;
			opacity: 0.2;
			padding: 5px;
		}

		.fa:hover {
			opacity: 1;
		}

		.fa-pencil {
			color: #ffa011;
		}

		.fa-plus {
			color: #328EA0;
		}

		.fa-times {
			color: red;
		}
	</style>
</head>

<body>
<div id="gantt_here" style='width:100%; height:100%;'></div>


<script>
	gantt.config.scale_height = 50;
	gantt.config.scales = [
		{unit: "month", step: 1, date: "%F, %Y"},
		{unit: "day", step: 1, date: "%j, %D"},
	];

	var colHeader = '<div class="gantt_grid_head_cell gantt_grid_head_add" onclick="gantt.create任务()"></div>',
		colContent = function (task) {
			return ('<i class="fa gantt_button_grid gantt_grid_edit fa-pencil" onclick="click表格Button(' + task.id + ', \'edit\')"></i>' +
				'<i class="fa gantt_button_grid gantt_grid_add fa-plus" onclick="click表格Button(' + task.id + ', \'add\')"></i>' +
				'<i class="fa gantt_button_grid gantt_grid_delete fa-times" onclick="click表格Button(' + task.id + ', \'delete\')"></i>');
		};
	gantt.config.columns = [
		{name: "text", tree: true, width: '*', resize: true},
		{name: "start_date", align: "center", resize: true},
		{name: "duration", align: "center"},
		{
			name: "buttons",
			label: colHeader,
			width: 85,
			template: colContent
		}
	];

	function click表格Button(id, action) {
		switch (action) {
			case "edit":
				gantt.show任务编辑框(id);
				break;
			case "add":
				gantt.create任务(null, id);
				break;
			case "delete":
				gantt.confirm({
					title: gantt.locale.labels.confirm_deleting_title,
					text: gantt.locale.labels.confirm_deleting,
					callback: function (res) {
						if (res)
							gantt.delete任务(id);
					}
				});
				break;
		}
	}

	gantt.init("gantt_here");
	gantt.parse(projects_with_milestones);

</script>
</body>
