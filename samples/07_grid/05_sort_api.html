<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>使用排序方法</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/controls_styles.css">
	<script src="../common/testdata.js"></script>
</head>

<body style="margin: 0">
<div class="gantt_control">
	<input type='button' value='Sort by priority' onclick='sortBy优先级()'>
	<input type='button' value='Sort by task name' onclick='sortByName()'>
</div>
<div id="gantt_here" style='width:100%; height:calc(100vh - 52px);'></div>

<script>
	var p_direction = false;
	var n_direction = false;

	function sortBy优先级() {
		if (p_direction) {
			gantt.sort("priority", false);
		} else {
			gantt.sort("priority", true);
		}
		p_direction = !p_direction;
	}

	function sortByName() {
		if (n_direction) {
			gantt.sort("text", false);
		} else {
			gantt.sort("text", true);
		}
		n_direction = !n_direction;
	}

	gantt.config.columns = [
		{name: "text", label: "任务名称", tree: true, resize: true, align: "center", width: 160},
		{name: "start_date", label: "开始 time", resize: true, align: "center"},
		{
			name: "priority", label: "优先级", resize: true, align: "center", template: function (obj) {
				if (obj.priority == 1) return "高";
				if (obj.priority == 2) return "普通";
				return "低";
			}
		},
		{ name: "add", label: "", width: 44 }
	]

	gantt.init("gantt_here");
	gantt.parse(users_data);
</script>
</body>
