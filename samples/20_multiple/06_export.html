<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>从甘特图导出数据</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/controls_styles.css">

	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
	</style>
</head>

<body>
<div class="gantt_control">
	<input value="Export to PDF : Gantt 1" type="button" onclick='gantt.exportToPDF()' style='margin:0 20px;'>
	<input value="Export to PNG : Gantt 1" type="button" onclick='gantt.exportToPNG()'>

	<input value="Export to PDF : Gantt 2" type="button" onclick='gantt2.exportToPDF()' style='margin:0 20px;'>
	<input value="Export to PNG : Gantt 2" type="button" onclick='gantt2.exportToPNG()'>
</div>

<div id="gantt_here" style='height:calc((100vh - 52px)/2);'>
</div>
<div id="gantt_here2" style='height:calc((100vh - 52px)/2);'>
</div>
<script>
	gantt.plugins({
		export_api: true,
	});

	gantt.init("gantt_here");
	gantt.parse({
		data: [
			{ id: 1, text: "项目 #1", start_date: "01-04-2023", duration: 18,
				progress: 0.4, open: true
			},
			{ id: 2, text: "任务 #1", start_date: "02-04-2023", duration: 8,
				progress: 0.6, parent: 1
			},
			{ id: 3, text: "任务 #2", start_date: "11-04-2023", duration: 8,
				progress: 0.6, parent: 1
			}
		],
		links: [
			{id: 1, source: 1, target: 2, type: "1"}
		]
	});

	var gantt2 = Gantt.getGanttInstance();
	gantt2.plugins({
		export_api: true,
	});

	gantt2.init("gantt_here2");
	gantt2.parse({
		data: [
			{ id: 1, text: "项目 #2", start_date: "01-04-2023", duration: 18,
				progress: 0.4, open: true
			},
			{ id: 3, text: "任务 #3", start_date: "02-04-2023", duration: 1,
				progress: 0.6, parent: 1
			},
			{ id: 4, text: "任务 #4", start_date: "03-04-2023", duration: 1,
				progress: 0.6, parent: 1
			}
		],
		links: [
			{id: 3, source: 3, target: 4, type: "0"}
		]
	});
</script>

</body>
