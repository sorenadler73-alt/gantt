<!DOCTYPE html>
<html>
	<head lang="zh-CN">
		<meta charset="UTF-8">
		<title>通过拖放创建新任务</title>
		<script src="../../codebase/dhtmlxgantt.js"></script>
		<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
		<style>
			html, body {
				height: 100%;
				margin: 0;
			}
		</style>
	</head>
	<body>
		<div id="gantt_here" style="width: 100%; height: 80%;"></div>
		<script>
			gantt.plugins({
				click_drag: true
			});
			gantt.message({
				text: "Click and drag to create a new task",
				expire: -1
			});

			gantt.config.lightbox.sections = [
				{ name: "description", height: 38, map_to: "text", type: "textarea", focus: true },
				{ name: "priority", height: 22, map_to: "priority", type: "select", options: [
					{key: 1, label: "高"},
					{key: 2, label: "普通"},
					{key: 3, label: "低"}
				] },
				{ name: "time", type: "duration", map_to: "auto" }
			];
			gantt.locale.labels.section_priority = "优先级";
			gantt.config.click_drag = {
				callback: onDragEnd,
				singleRow: true
			};

			gantt.init("gantt_here");
			gantt.parse({
				data: [
					{ id: 1, text: "项目 #1", start_date: "01-04-2023", duration: 18, progress: 0.4, open: true },
					{ id: 2, text: "任务 #1", start_date: "02-04-2023", duration: 8, progress: 0.6, parent: 1 },
					{ id: 3, text: "任务 #2", start_date: "11-04-2023", duration: 8, progress: 0.6, parent: 1 }
				],
				links: [
					{id: 1, source: 1, target: 2, type: "1"}
				]
			});
			function onDragEnd(startPoint, endPoint, startDate, endDate, tasksBetweenDates, tasksInRow) {
				if (tasksInRow.length === 1) {
					var parent = tasksInRow[0];
					gantt.create任务({
						text:"Subtask of " + parent.text,
						start_date: gantt.roundDate(startDate),
						end_date: gantt.roundDate(endDate)
					}, parent.id);
				} else if (tasksInRow.length === 0) {
					gantt.create任务({
						text:"新任务",
						start_date: gantt.roundDate(startDate),
						end_date: gantt.roundDate(endDate)
					});
				}
			}

		</script>
	</body>
</html>
