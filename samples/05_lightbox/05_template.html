<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>模板控件</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<script src="../common/testdata.js"></script>
	<style>
		html, body{
			padding:0;
			margin: 0;
		}

		#title1 {
			padding-left: 35px;
			color: black;
			font-weight: bold;
		}

		#title2 {
			padding-left: 15px;
			color: black;
			font-weight: bold;
		}
	</style>
</head>

<body>
<div id="gantt_here" style='height:100vh;'></div>

<script>
	gantt.locale.labels.section_template = "详情";
	gantt.config.lightbox.sections = [
		{name: "description", height: 38, map_to: "text", type: "textarea", focus: true},
		{name: "template", type: "template", map_to: "my_template"},
		{name: "time", type: "duration", map_to: "auto"}
	];

	gantt.attachEvent("onBefore任务编辑框", function (id) {
		var task = gantt.get任务(id);
		task.my_template = "<span id='title1'>Holders: </span>" + task.users + "<span id='title2'>进度: </span>" + task.progress * 100 + " %";
		return true;
	});

	gantt.init("gantt_here");
	gantt.parse(users_data);
	gantt.show任务编辑框(1);
</script>
</body>
