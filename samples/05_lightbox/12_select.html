<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>下拉选择控件</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<script src="../common/testdata.js"></script>
	<style>
		html, body{
			padding:0;
			margin: 0;
		}
	</style>
</head>

<body>
<div id="gantt_here" style='height:100vh;'></div>

<script>
	gantt.config.grid_width = 380;
	gantt.config.add_column = false;
	gantt.config.columns = [
		{name: "text", label: "任务名称", resize: true, tree: true, width: '*'},
		{name: "start_date", label: "开始 time", resize: true, align: "center"},
		{name: "duration", label: "工期", resize: true, align: "center"},
		{
			name: "priority", label: "优先级", width: 80, align: "center",
			template: function (item) {
				if (item.priority == 1)
					return "高";
				if (item.priority == 2)
					return "普通";
				if (item.priority == 3)
					return "低";
				return "Undefined";
			}
		}
	];
	gantt.locale.labels.section_priority = "优先级";

	gantt.config.lightbox.sections = [
		{name: "description", height: 38, map_to: "text", type: "textarea", focus: true},
		{
			name: "priority", map_to: "priority", type: "select",
			options: [
				{key: 1, label: "高"},
				{key: 2, label: "普通"},
				{key: 3, label: "低"}
			]
		},
		{name: "time", type: "duration", map_to: "auto"}
	];

	gantt.init("gantt_here");
	gantt.parse(users_data);
	gantt.show任务编辑框(1);
</script>
</body>
